<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Dash | Code With Irfan Ali G</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-decor">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <main class="game-card" id="game-card">
    <!-- Top Branding Title -->
    <div class="creator-title">Code With Irfan Ali G</div>

    <header class="game-header">
      <h1 class="logo">⚡ Type Dash</h1>
      <div class="controls">
        <button id="sound-btn" class="icon-btn" aria-label="Toggle Sound">🔊</button>
        <select id="difficulty-select" aria-label="Select Difficulty">
          <option value="easy">Easy (Kids)</option>
          <option value="medium" selected>Medium (Standard)</option>
          <option value="hard">Hard (Pro)</option>
        </select>
        <select id="time-select" aria-label="Select Timer Duration">
          <option value="15">15 Seconds</option>
          <option value="30" selected>30 Seconds</option>
          <option value="60">60 Seconds</option>
        </select>
      </div>
    </header>

    <!-- Interactive Arcade Stats -->
    <section class="stats-bar">
      <div class="stat-box">
        <span class="stat-label">TIME</span>
        <span class="stat-value" id="timer">30s</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">WPM</span>
        <span class="stat-value" id="wpm">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">ACCURACY</span>
        <span class="stat-value" id="accuracy">100%</span>
      </div>
      <div class="stat-box highlight">
        <span class="stat-label">STREAK</span>
        <span class="stat-value" id="streak">0x</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">BACKSPACES</span>
        <span class="stat-value" id="backspaces">0</span>
      </div>
    </section>

    <!-- Live Text Box -->
    <section class="typing-area" id="typing-box" tabindex="0">
      <div id="word-display" class="word-display">Click 'Start Game' or press Space to begin!</div>
      <input type="text" id="hidden-input" autocomplete="off" autocapitalize="none" spellcheck="false">
    </section>

    <footer class="game-footer">
      <button id="start-btn" class="btn btn-primary">Start Game</button>
      <button id="restart-btn" class="btn btn-secondary">Restart</button>
    </footer>
  </main>

  <!-- Game Over Result Modal -->
  <div class="modal-overlay hidden" id="result-modal">
    <div class="modal-card">
      <h2 id="modal-title">🎉 Level Complete!</h2>
      <p class="modal-subtitle" id="modal-rating">Rank: Keyboard Master</p>
      
      <div class="modal-grid">
        <div class="m-stat">
          <span id="final-wpm">0</span>
          <label>Words / Min</label>
        </div>
        <div class="m-stat">
          <span id="final-accuracy">0%</span>
          <label>Accuracy</label>
        </div>
        <div class="m-stat">
          <span id="final-streak">0</span>
          <label>Best Streak</label>
        </div>
        <div class="m-stat">
          <span id="final-backspaces">0</span>
          <label>Backspaces</label>
        </div>
      </div>

      <div class="score-banner">
        TOTAL SCORE: <span id="final-score">0</span>
      </div>

      <button id="modal-restart-btn" class="btn btn-primary">Play Again 🚀</button>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script src="script.js"></script>
</body>
</html>
