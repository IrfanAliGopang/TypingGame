  <style>
    /* Main Layout Styling */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
    }

    /* Main Website Content Container */
    .main-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background-color: #ffffff;
      min-height: 100vh;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    /* Side Banner Containers */
    .side-ad {
      position: fixed;
      top: 50px; /* Distance from top of the screen */
      width: 160px;
      height: 600px;
      z-index: 999;
    }

    .left-ad {
      left: 10px; /* Fixed to the left margin */
    }

    .right-ad {
      right: 10px; /* Fixed to the right margin */
    }

    /* HIDE ADS ON MOBILE & TABLETS
       Prevents ads from overlapping content on small screens */
    @media screen and (max-width: 1250px) {
      .side-ad {
        display: none !important;
      }
    }
  </style>
</head>
